# Cosmic Terminal Theme
# Вдохновлено Material 3 и космической эстетикой Waybar

# Основные цвета
color0 #0D1423      # Самый темный фон
color8 #1E2F4A      # Вторичный темный фон

# Основные акценты (красные/розовые)
color1 #FFB4AB      # Primary error - как в Waybar
color9 #FFC9C1      # Яркая версия красного

# Основные акценты (голубые/синие) - как m3-primary
color2 #8CC8FF      # Primary blue - свечение горизонта
color10 #A5D2FF     # Яркая версия голубого

# Вторичные акценты (светлые)
color3 #E8C170      # Теплый акцент - как m3-tertiary
color11 #F0D68C     # Яркая версия теплого

# Фиолетовые акценты (космические)
color4 #B4A0E8      # Фиолетовый космический
color12 #C4B8F0     # Яркая версия фиолетового

# Голубые акценты (вторичные)
color5 #7E96B8      # приглушенный голубой - как m3-on-variant
color13 #9EA8C0     # Яркая версия приглушенного

# Светлые акценты
color6 #E3EDFA      # Основной текст - как m3-on-surface
color14 #EFF5FC     # Яркая версия текста

# Светлые тона
color7 #C4C6CD      # Приглушенный текст
color15 #F5F5F5     # Самый светлый

# Основные настройки терминала
cursor #E3EDFA      # Цвет курсора как основной текст
cursor_text_color #0D1423  # Цвет текста под курсором
background #0D1423   # Фон как самый темный тон
foreground #E3EDFA   # Основной текст как m3-on-surface

# Выделение
selection_foreground #7E96B8  # Приглушенный текст для выделения
selection_background #43474C   # Темный фон для выделения

# Границы окон
active_border_color #8CC8FF    # Активная граница как primary blue
inactive_border_color #1E2F4A   # Неактивная граница как secondary dark

# Ссылки
url_color #8CC8FF    # Цвет ссылок как primary blue

# Панель вкладок в стиле Material 3
active_tab_foreground #0D1423    # Темный текст для активной вкладки
active_tab_background #8CC8FF    # Primary blue фон для активной вкладки
inactive_tab_foreground #7E96B8  # Приглушенный текст для неактивных
inactive_tab_background #1E2F4A  # Secondary dark фон для неактивных

# Эффекты
cursor_trail_color #7E96B8      # Цвет следа курсора как приглушенный

# Дополнительные настройки для космического вида
tab_bar_style powerline
tab_title_template "{title}"

# Прозрачность для лучшей интеграции с обоями
background_opacity 1
dynamic_background_opacity yes

# Настройки шрифта (оставляем существующие)
font_family "JetBrains Mono", "Symbols Nerd Font Mono"
font_size 20.0
window_padding_width 15

# Отключаем звуковые уведомления
enable_audio_bell no

# Настройки прокрутки
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# Горячие клавиши для прозрачности
map ctrl+shift+u>0 change_background_opacity +0.05
map ctrl+shift+u>9 change_background_opacity -0.05
map ctrl+shift+f5 load_config_file

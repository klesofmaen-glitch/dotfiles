# Station Terminal Theme
# Палитра снята с обоев mpp/111.png: заснеженный ночной вокзал.
# Ночь #0E1320 · небо #7EC3EA · янтарь окон #E8A75A · снег #DCE6F2

# Основные цвета
color0 #141B2B      # Самый тёмный тон ночи
color8 #2A3A55      # Вторичный тёмный (силуэты деревьев)

# Основные акценты (красные — хвостовые огни поезда)
color1 #FF9E8A      # Error /urgent
color9 #FFC0AE      # Яркая версия красного

# Основные акценты (голубые — зимнее небо)
color2 #7EC3EA      # Primary blue — светлый тон неба
color10 #A8D8F0     # Яркая версия голубого

# Вторичные акценты (тёплый свет из окон)
color3 #E8A75A      # Tertiary amber — окна поезда и лампа
color11 #F7C98A     # Яркая версия янтарного

# Синие акценты (далёкие горы)
color4 #80AEDC      # Mountain blue
color12 #A8CCF0     # Яркая версия синего

# Приглушённые акценты (снежная дымка)
color5 #8898B4      # Muted — тени на снегу
color13 #B0B8D4     # Яркая версия приглушённого

# Светлые акценты (снег)
color6 #DCE6F2      # Основной текст — снег
color14 #F0F6FC     # Яркая версия текста

# Нейтральные тона
color7 #B8C4D8      # Приглушённый текст
color15 #E8EEF5     # Самый светлый

# Основные настройки терминала
cursor #E8A75A      # Курсор — как тёплая лампа на станции
cursor_text_color #0E1320
background #0E1320  # Ночь из обоев
foreground #DCE6F2  # Снежный текст

# Выделение
selection_foreground #DCE6F2
selection_background #33456B

# Границы окон
active_border_color #7EC3EA     # Небо
inactive_border_color #1C2A44   # Ночь

# Ссылки
url_color #7EC3EA

# Панель вкладок
active_tab_foreground #0E1320
active_tab_background #7EC3EA
inactive_tab_foreground #8898B4
inactive_tab_background #1C2A44

# Эффекты
cursor_trail_color #8898B4

# Прозрачность (1 — фон полностью непрозрачный)
background_opacity 1
dynamic_background_opacity yes

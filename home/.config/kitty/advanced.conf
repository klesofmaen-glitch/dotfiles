# Дополнительные настройки для продвинутых пользователей
# Этот файл можно подключать в основном kitty.conf для расширенной функциональности

# ===== Улучшенная работа с буфером =====
clipboard_control write-clipboard write-primary
clipboard_control read-clipboard read-primary

# ===== Настройка курсора =====
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ===== Улучшенная прокрутка =====
scroll_lines 3
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# ===== Настройка макросов =====
map f1 launch --hold --stdin bash -c 'echo "=== Помощь ==="; echo "Используйте Ctrl+Shift+H для истории"; echo "Используйте Ctrl+Shift+T для новой вкладки"; exec bash -i'
map f2 launch --hold --stdin bash -c 'echo "=== Система ==="; neofetch; exec bash -i'
map f3 launch --hold --stdin bash -c 'echo "=== Процессы ==="; htop; exec bash -i'

# ===== Улучшенная навигация =====
map ctrl+shift+right next_window
map ctrl+shift+left previous_window
map ctrl+shift+up layout_tall
map ctrl+shift+down layout_horizontal

# ===== Работа с буфером обмена =====
map ctrl+shift+plus>0 copy_to_clipboard
map ctrl+shift+plus>9 paste_from_clipboard

# ===== Быстрые команды =====
map ctrl+shift+e edit_config_file
map ctrl+shift+> new_window_with_cwd
map ctrl+shift+< new_tab_with_cwd

# ===== Улучшенная работа с вкладками =====
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+close_tab close_tab

# ===== Настройка внешнего вида =====
# Мягкие тени для окон
window_border_width 2
window_margin_width 0
window_padding_width 15

# Цвета для разных состояний
active_border_color #8CC8FF
inactive_border_color #1E2F4A
bell_border_color #FFB4AB

# ===== Настройка аудио =====
enable_audio_bell no
visual_bell_duration 0.1
visual_bell_color #FFB4AB

# ===== Настройка производительности =====
scrollback_lines 10000
scrollback_pager less -R -F -K
scrollback_pager_history_size 0

# ===== Настройка мыши =====
mouse_map left click mouse_move cursor_shape beam
mouse_map left click+shift mouse_move cursor_shape beam
mouse_map right click mouse_selection grab_set
mouse_map right click+shift mouse_selection grab_set
mouse_map ctrl+shift+right mouse_click_link_toggle_selection

# ===== Настройка клавиатуры =====
kitten hints --regex 'https?://\S+|\b\w+@\w+\.\w+\b' --map 'ctrl+shift+o' launch --stdin-type path --stdin-clipboard

# ===== Настройка цвета =====
# Цвета для различных состояний
color0 #0D1423
color8 #1E2F4A
color1 #FFB4AB
color9 #FFC9C1
color2 #8CC8FF
color10 #A5D2FF
color3 #E8C170
color11 #F0D68C
color4 #B4A0E8
color12 #C4B8F0
color5 #7E96B8
color13 #9EA8C0
color6 #E3EDFA
color14 #EFF5FC
color7 #C4C6CD
color15 #F5F5F5

# ===== Настройка шрифта =====
font_family "JetBrains Mono", "Symbols Nerd Font Mono"
bold_font auto
italic_font auto
bold_italic_font auto
font_size 20.0
adjust_baseline 0
disable_ligatures never
cursor_shape beam
cursor_blink_interval 0.5

# ===== Настройка окна =====
window_padding_width 15
window_border_width 2
window_margin_width 0
hide_window_decorations yes
confirm_os_window_close 0

# ===== Настройка вкладок =====
tab_bar_style powerline
tab_title_template "{index}: {title}"
active_tab_foreground #0D1423
active_tab_background #8CC8FF
inactive_tab_foreground #7E96B8
inactive_tab_background #1E2F4A
tab_bar_edge top